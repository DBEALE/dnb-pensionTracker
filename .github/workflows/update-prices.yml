name: Update prices

on:
  schedule:
    # 18:30 UTC on weekdays. HSBC values at 17:00 UK and Aviva publishes the
    # previous working day's close, so this runs after everything has settled.
    # Note: GitHub disables scheduled workflows after 60 days of repository
    # inactivity. The keepalive step below touches a file monthly to avoid that.
    - cron: "30 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices
        run: node scripts/fetch-prices.mjs

      - name: Keepalive (first weekday of the month)
        run: |
          if [ "$(date -u +%d)" -le "03" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          fi

      - name: Commit
        run: |
          git config user.name  "pension-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json .keepalive
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "prices: $(date -u +%Y-%m-%d)"
            git push
          fi
